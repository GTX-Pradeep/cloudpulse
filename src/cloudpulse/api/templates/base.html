<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CloudPulse{% endblock %}</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #e2e2de;
  --accent: #2f5bd3; --good: #1f7a4d; --bad: #b4232c; --warn: #9a6400; --code: #f0f0ec;
  --good-bg: #e6f4ec; --bad-bg: #fbe9ea; --warn-bg: #fdf3e1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e9eb; --muted: #9aa0a8; --line: #30343a;
    --accent: #7ea2ff; --good: #5cc98f; --bad: #ff7b82; --warn: #f0b85a; --code: #262a30;
    --good-bg: #183326; --bad-bg: #3a1c1f; --warn-bg: #3a2e17;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { border-bottom: 1px solid var(--line); background: var(--panel); }
header .wrap { display: flex; align-items: baseline; gap: 16px; }
.brand { font-weight: 700; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; font-size: 17px; }
.tag { color: var(--muted); font-size: 13px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 8px 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 14px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
code, pre { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 6px; }
code { padding: 1px 5px; }
pre { padding: 10px; overflow-x: auto; white-space: pre-wrap; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .03em; }
.SUPPORTED { background: var(--good-bg); color: var(--good); }
.REJECTED { background: var(--bad-bg); color: var(--bad); }
.INCONCLUSIVE, .filtered_out, .failed { background: var(--warn-bg); color: var(--warn); }
.muted { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.tablewrap { overflow-x: auto; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.hl { color: var(--bad); font-weight: 600; }
details summary { cursor: pointer; color: var(--muted); }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">CloudPulse</a>
<span class="tag">experiment-validated PostgreSQL regression remediation</span></div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
